# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - civictrack-sachin

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: Start isolated MongoDB replica set for integration tests
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name civictrack-test-mongodb \
            -p 127.0.0.1:27017:27017 mongo:8.0 \
            --replSet civictrack-rs --bind_ip_all

          for attempt in {1..60}; do
            if docker exec civictrack-test-mongodb mongosh --quiet --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)' >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs civictrack-test-mongodb
              echo "MongoDB did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

          docker exec civictrack-test-mongodb mongosh --quiet --eval \
            'rs.initiate({ _id: "civictrack-rs", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'

          for attempt in {1..60}; do
            if docker exec civictrack-test-mongodb mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' >/dev/null 2>&1; then
              echo "MongoDB replica set PRIMARY is ready"
              exit 0
            fi
            sleep 1
          done
          docker logs civictrack-test-mongodb
          echo "MongoDB replica set did not elect a PRIMARY" >&2
          exit 1

      - name: Select browser for integration tests
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v microsoft-edge || command -v google-chrome)"
          echo "CIVICTRACK_BROWSER_PATH=$browser" >> "$GITHUB_ENV"

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Remove test MongoDB container
        if: always()
        run: docker rm -f civictrack-test-mongodb || true

      - name: Prepare and verify deployment ZIP
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d "$RUNNER_TEMP/civictrack-package.XXXXXX")"
          cp package.json package-lock.json "$stage/"
          cp -R client server "$stage/"
          # Dependencies are installed on Linux with the same Node major as App Service.
          npm ci --omit=dev --prefix "$stage"
          (cd "$stage" && node -e "require('express'); require('mongoose'); require('bcrypt'); require('sharp')")
          (cd "$stage" && zip -qr "$RUNNER_TEMP/civictrack-app.zip" .)
          unzip -tq "$RUNNER_TEMP/civictrack-app.zip"
          unzip -Z -1 "$RUNNER_TEMP/civictrack-app.zip" > "$RUNNER_TEMP/civictrack-zip-contents.txt"
          for entry in package.json package-lock.json client/index.html server/server.js node_modules/express/package.json node_modules/mongoose/package.json; do
            grep -Fx "$entry" "$RUNNER_TEMP/civictrack-zip-contents.txt" >/dev/null || { echo "Missing from ZIP: $entry" >&2; exit 1; }
          done
          echo "Verified application files and production dependencies at ZIP root."

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ${{ runner.temp }}/civictrack-app.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./deployment

      - name: Verify downloaded deployment ZIP
        shell: bash
        run: |
          set -euo pipefail
          archive=./deployment/civictrack-app.zip
          test -f "$archive"
          unzip -tq "$archive"
          unzip -Z -1 "$archive" > "$RUNNER_TEMP/civictrack-zip-contents.txt"
          for entry in package.json package-lock.json client/index.html server/server.js node_modules/express/package.json node_modules/mongoose/package.json; do
            grep -Fx "$entry" "$RUNNER_TEMP/civictrack-zip-contents.txt" >/dev/null || { echo "Missing from downloaded ZIP: $entry" >&2; exit 1; }
          done
          echo "Deployment ZIP verified."

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DB1C6F1EB6084AEDA1AF36E19068A865 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_11AE12C16D614C6D9BA5AEE4AADB4768 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C2519EFE334F4FAD9A62CCD3CC082992 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'civictrack-sachin'
          slot-name: 'Production'
          package: ./deployment/civictrack-app.zip

